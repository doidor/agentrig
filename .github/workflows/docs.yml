name: Docs

on:
  push:
    branches: [main]
    paths:
      - "AGENT-RIG.md"
      - "MIGRATION.md"
      - ".agents/agents/**"
      - ".agents/skills/**"
      - ".agents/rules/**"
      - "validate.mjs"
      - "docs/**"
      - "layouts/**"
      - "scripts/**"
      - "test/docs.test.mjs"
      - "markbook.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "AGENT-RIG.md"
      - "MIGRATION.md"
      - ".agents/agents/**"
      - ".agents/skills/**"
      - ".agents/rules/**"
      - "validate.mjs"
      - "docs/**"
      - "layouts/**"
      - "scripts/**"
      - "test/docs.test.mjs"
      - "markbook.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: node --test test/docs.test.mjs
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
