name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "knowledge/PRINCIPLES.md"
      - "markbook.config.ts"
      - "scripts/sync-principles-to-docs.mjs"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The deploy job needs its own permissions block — workflow-level perms are NOT inherited by
    # jobs that declare an `environment`. Without id-token:write here, actions/deploy-pages@v4's
    # OIDC token exchange fails with "401 Requires authentication" (saw this 2026-06-10 after
    # PR #11 merged to main).
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
